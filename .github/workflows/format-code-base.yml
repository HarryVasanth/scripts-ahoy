name: 💅 Format code

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: 📀 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Prettier
        run: npm install --no-save --no-package-lock prettier@3 prettier-plugin-sh

      - name: 💄 Format
        run: npx prettier --write "**/*.{js,md,yml,sh,html,css}" --plugin=prettier-plugin-sh

      - name: 📎 Commit
        run: |
          rm -rf node_modules package-lock.json
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format code"
          git push
